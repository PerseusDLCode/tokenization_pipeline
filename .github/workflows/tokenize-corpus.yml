name: Tokenize corpus

# Runs mvp-pipeline (perseus-cts Chunker compile -> tokenize, lemmatizing
# Greek and Latin) against the corpora in corpora.json, and pushes each
# resulting tokens tree as a per-corpus OCI artifact to GHCR:
#
#   ghcr.io/perseusdlcode/mvp-tokens-<tag_name>:<corpus sha>-<this repo's sha>
#   ghcr.io/perseusdlcode/mvp-tokens-<tag_name>:latest
#
# MinimumViablePerseus's build-corpus.yml pulls :latest to render token
# spans, and build-search-index.yml (triggered when this workflow completes)
# turns all of them into the corpus search index.
#
# Incremental: the previous :latest is restored before running, and
# mvp-tokenize only reprocesses chunks whose XML or pipeline version
# changed (see run_tokenizer.py's tokens-manifest.json), so a nightly run
# against an unchanged corpus is skipped outright and a run after a commit
# only pays for what that commit touched.
#
# A run that can't finish within the job's time limit (e.g. the first
# lemmatizing pass over First1KGreek) stops tokenizing after
# TIME_BUDGET_MINUTES, pushes what it has under a "-partial-<run id>" tag
# (and :latest), and dispatches this workflow again for that corpus; the
# next run restores :latest and carries on. Only a complete run pushes the
# plain <corpus sha>-<repo sha> tag the skip check looks for.

on:
  schedule:
    - cron: "17 5 * * *"
  # Corpus repos (or anyone) can request a run:
  #   gh api repos/PerseusDLCode/tokenization_pipeline/dispatches \
  #     -f event_type=corpus-updated -F 'client_payload[corpus]=greekLit'
  repository_dispatch:
    types: [corpus-updated]
  workflow_dispatch:
    inputs:
      corpus:
        description: >-
          Tokenize only this corpus (a "name" from corpora.json). Leave blank
          for all of them.
        required: false
      force:
        description: >-
          Run even if this corpus SHA was already tokenized by this commit
          (still incremental; use mvp-pipeline --force locally for a full
          rebuild).
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  # To dispatch a follow-up run when the time budget runs out.
  actions: write

jobs:
  corpora:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "matrix=$(jq -c . corpora.json)" >> "$GITHUB_OUTPUT"

  tokenize:
    needs: corpora
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # One run per corpus at a time, since each restores and replaces that
    # corpus's :latest. Per corpus, not per workflow: GitHub keeps only one
    # pending run per group, so a shared group would let one corpus's
    # follow-up dispatch cancel another's.
    concurrency:
      group: tokenize-${{ matrix.tag_name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.corpora.outputs.matrix) }}
    env:
      REQUESTED: ${{ inputs.corpus || github.event.client_payload.corpus }}
      ARTIFACT: ghcr.io/perseusdlcode/mvp-tokens-${{ matrix.tag_name }}
      # Leaves time inside timeout-minutes for restoring, syncing,
      # compressing and pushing, which take a while for the big corpora.
      TIME_BUDGET_MINUTES: 280
    steps:
      - name: Skip corpora that weren't requested
        id: gate
        run: |
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "${{ matrix.name }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout mvp-tokenization (this repo)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          path: mvp-tokenization

      - name: Resolve corpus HEAD SHA
        if: steps.gate.outputs.run == 'true'
        id: sha
        run: |
          CORPUS_SHA=$(git ls-remote "https://github.com/${{ matrix.repo_owner }}/${{ matrix.repo_name }}" "refs/heads/${{ matrix.branch }}" | cut -f1)
          if [ -z "$CORPUS_SHA" ]; then
            echo "Could not resolve HEAD SHA for ${{ matrix.repo_owner }}/${{ matrix.repo_name }}@${{ matrix.branch }}" >&2
            exit 1
          fi
          # Keyed on this repo's commit too, so a tokenizer change reaches
          # every corpus on the next run (mvp-tokenize decides per chunk
          # whether anything actually needs redoing).
          echo "tag=${CORPUS_SHA}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install oras
        if: steps.gate.outputs.run == 'true'
        uses: oras-project/setup-oras@v2

      - name: Skip if already tokenized
        if: steps.gate.outputs.run == 'true'
        id: skip
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif oras manifest fetch "$ARTIFACT:${{ steps.sha.outputs.tag }}" >/dev/null 2>&1; then
            echo "Already tokenized: $ARTIFACT:${{ steps.sha.outputs.tag }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout ${{ matrix.name }}
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo_owner }}/${{ matrix.repo_name }}
          ref: ${{ matrix.branch }}
          path: corpus

      - name: Restore previous tokens
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        run: |
          mkdir -p tokens previous
          if oras pull "$ARTIFACT:latest" -o previous; then
            tar --zstd -xf previous/tokens.tar.zst -C tokens
            rm -rf previous
          else
            echo "No previous tokens artifact; tokenizing from scratch."
          fi

      - name: Install uv
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Cache stanza models
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: mvp-tokenization/stanza_models
          key: stanza-${{ hashFiles('mvp-tokenization/uv.lock') }}

      - name: Sync mvp-tokenization
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        working-directory: mvp-tokenization
        run: uv sync

      # A handful of failed chunks shouldn't hold back every other text's
      # update: failures are recorded in the run manifest and retried on the
      # next run (they have no tokens-manifest entry), and what did succeed
      # is still pushed.
      - name: Run mvp-pipeline
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        id: pipeline
        working-directory: mvp-tokenization
        run: |
          mkdir -p ../proto
          set +e
          uv run mvp-pipeline \
            --corpus-root ../corpus \
            --proto-dir ../proto \
            --tokens-dir ../tokens \
            --manifest ../run-manifest.json \
            --prune \
            --time-budget-minutes "$TIME_BUDGET_MINUTES"
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo "::warning::mvp-pipeline exited $status for ${{ matrix.name }}; see the run manifest artifact."
          fi
          test -f ../run-manifest.json
          echo "generated=$(jq '.tokenize.generated // 0' ../run-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "deferred=$(jq '.tokenize.deferred // 0' ../run-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload run manifest
        if: always() && steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: run-manifest-${{ matrix.tag_name }}
          path: run-manifest.json
          retention-days: 30

      - name: Push tokens artifact
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true'
        run: |
          tag="${{ steps.sha.outputs.tag }}"
          if [ "${{ steps.pipeline.outputs.deferred }}" != "0" ]; then
            # Not the tag the skip check looks for, so the follow-up run
            # isn't skipped.
            tag="${tag}-partial-${GITHUB_RUN_ID}"
          fi
          tar --zstd -cf tokens.tar.zst -C tokens .
          oras push "$ARTIFACT:${tag}" tokens.tar.zst:application/vnd.perseus.mvp.tokens
          oras tag "$ARTIFACT:${tag}" latest

      - name: Continue in a follow-up run
        if: steps.gate.outputs.run == 'true' && steps.skip.outputs.skip != 'true' && steps.pipeline.outputs.deferred != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.pipeline.outputs.generated }}" = "0" ]; then
            echo "::error::Time budget ran out before tokenizing anything for ${{ matrix.name }}; not dispatching a follow-up."
            exit 1
          fi
          echo "${{ steps.pipeline.outputs.deferred }} chunks left for ${{ matrix.name }}; dispatching a follow-up run."
          gh workflow run tokenize-corpus.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f corpus="${{ matrix.name }}"
