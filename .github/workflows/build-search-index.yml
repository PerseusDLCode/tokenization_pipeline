name: Build search index

# Builds the corpus search index (mvp-index) from every corpus's latest
# tokens artifact and pushes it to GHCR:
#
#   ghcr.io/perseusdlcode/mvp-search-index:<digest of inputs>
#   ghcr.io/perseusdlcode/mvp-search-index:latest
#
# The artifact holds search-<sha12>.db and manifest.json. MinimumViablePerseus's
# deploy/cron-deploy.sh pulls :latest and serves it at /search-index/, where
# the /search page queries it over HTTP range requests.
#
# Always a full rebuild -- incrementality lives upstream, in the tokenizer --
# so the index is a pure function of the tokens artifacts plus this repo's
# code, and is skipped when neither changed.

on:
  workflow_run:
    workflows: ["Tokenize corpus"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if these exact inputs were already indexed.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-search-index
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      INDEX: ghcr.io/perseusdlcode/mvp-search-index
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install oras
        uses: oras-project/setup-oras@v2

      - name: Resolve tokens artifacts
        id: inputs
        run: |
          : > sources.txt
          for tag in $(jq -r '.[].tag_name' corpora.json); do
            ref="ghcr.io/perseusdlcode/mvp-tokens-${tag}:latest"
            if digest=$(oras manifest fetch --descriptor "$ref" | jq -r .digest); then
              echo "${tag}=${digest}" >> sources.txt
            else
              echo "::warning::No tokens artifact for ${tag}; it won't be in the index."
            fi
          done
          cat sources.txt
          digest=$( (cat sources.txt; echo "code=${GITHUB_SHA}") | sha256sum | cut -c1-32)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Skip if already indexed
        id: skip
        run: |
          if [ "${{ inputs.force }}" != "true" ] && oras manifest fetch "$INDEX:${{ steps.inputs.outputs.digest }}" >/dev/null 2>&1; then
            echo "Already indexed: $INDEX:${{ steps.inputs.outputs.digest }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull tokens artifacts
        if: steps.skip.outputs.skip != 'true'
        run: |
          while IFS='=' read -r tag digest; do
            mkdir -p "tokens/${tag}" "dl/${tag}"
            oras pull "ghcr.io/perseusdlcode/mvp-tokens-${tag}@${digest}" -o "dl/${tag}"
            tar --zstd -xf "dl/${tag}/tokens.tar.zst" -C "tokens/${tag}"
            rm -rf "dl/${tag}"
          done < sources.txt
          du -sh tokens

      - name: Install uv
        if: steps.skip.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v7

      # Only the index builder's dependencies are needed, but they share the
      # project, so this syncs the NLP stack too.
      - name: Build index
        if: steps.skip.outputs.skip != 'true'
        run: |
          uv sync
          args=()
          while IFS='=' read -r tag digest; do
            args+=(--tokens-dir "tokens/${tag}" --source "${tag}=${digest}")
          done < sources.txt
          uv run mvp-index "${args[@]}" --out out
          rm -rf tokens

      - name: Smoke-test index
        if: steps.skip.outputs.skip != 'true'
        run: uv run python scripts/smoke_test_index.py out

      - name: Push index artifact
        if: steps.skip.outputs.skip != 'true'
        working-directory: out
        run: |
          db=$(jq -r .db manifest.json)
          oras push "$INDEX:${{ steps.inputs.outputs.digest }}" \
            "${db}:application/vnd.sqlite3" \
            manifest.json:application/json
          oras tag "$INDEX:${{ steps.inputs.outputs.digest }}" latest
