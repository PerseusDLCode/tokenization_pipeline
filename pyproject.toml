[project]
name = "mvp-tokenization"
version = "0.1.0"
description = "Tokenization, lemmatization, and corpus search indexing for MinimumViablePerseus"
readme = "README.md"
authors = [
    { name = "Charles Pletcher", email = "cpletcher2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "grc-palimpsest-joint-trf==0.2.0",
    "la-core-web-lg==3.9.6",
    "kodon-py",
    "lxml>=6.0.4",
    "lxml-stubs>=0.5.1",
    "perseus-cts",
    "spacy>=3.8.16,<3.9.0",
    "spacy-transformers>=1.4.0,<1.5.0",
    "stanza>=1.14.0",
    "zstandard>=0.23.0",
]

[project.scripts]
mvp-tokenize = "mvp_tokenization.run_tokenizer:main"
mvp-analyze = "mvp_tokenization.run_analyzer:main"
mvp-pipeline = "mvp_tokenization.run_corpus:main"
mvp-index = "mvp_tokenization.build_index:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvp_tokenization"]

[tool.uv.sources]
grc-palimpsest-joint-trf = { url = "https://huggingface.co/pnadel/grc_palimpsest_joint_trf/resolve/main/grc_palimpsest_joint_trf-0.2.0-py3-none-any.whl" }
kodon-py = {git="https://github.com/PerseusDLCode/kodon-py", rev = "b925cf4cb7254e641ab50075dbb1048fc9bc5cfc"}
la-core-web-lg = { url = "https://huggingface.co/latincy/la_core_web_lg/resolve/main/la_core_web_lg-3.9.6-py3-none-any.whl" }
perseus-cts = {git = "https://github.com/PerseusDLCode/perseus-cts", rev = "acd1ba1b94daba5180ad9da5df864a8fa7842e48" }
